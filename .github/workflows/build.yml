# Builds PlanDesk-Setup.exe on Windows and publishes it as a release. Installed copies update themselves
# from these releases. Download link:
#   https://github.com/jlmcpherson1/plandesk-windows/releases/latest/download/PlanDesk-Setup.exe
name: Build PlanDesk for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Version 1.0.<build number>
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm run dist
        env: { GH_TOKEN: "${{ github.token }}" }
